# Matrix sandbox app — local database (compose project `matrix-app`).
#
#   Managed by ./start.sh / ./stop.sh / ./reset-db.sh — see README.md.
#   Values come from ./.env (gitignored; generated by start.sh, template .env.example).
#
# Separate from the NocoBase stack (project `matrix-configurator`, port 13000):
# different project name, network, volume and port — the two never share state.

name: matrix-app

services:
  db:
    # Vanilla Postgres 16 + db-init/00-supabase-shim.sql (roles, extensions,
    # auth.jwt()). Same image the NocoBase stack already pulled; see README.md
    # for why not supabase/postgres.
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${APP_DB_NAME:?set APP_DB_NAME in app-stack/.env}
      POSTGRES_USER: ${APP_DB_USER:?set APP_DB_USER in app-stack/.env}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in app-stack/.env}
    ports:
      # Loopback only — never reachable from the network.
      - "127.0.0.1:${APP_DB_PORT:-54330}:5432"
    volumes:
      - app_db_data:/var/lib/postgresql/data
      # No bind mounts on purpose: a host bind mount from ~/Desktop makes Docker
      # Desktop wait on a macOS folder-access prompt. db-init/*.sql is streamed in
      # over `docker compose exec -T db psql` by reset-db.sh instead.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 5s
      retries: 30

volumes:
  app_db_data:
